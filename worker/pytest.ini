[pytest]
# Makes worker/ the rootdir for any test path inside it, so worker/conftest.py
# (which installs the network guard before collection) is always loaded, also
# when pytest is started from the repository root.
# testpaths: collect only tests/ when pytest is run without paths, so the manual,
# network-capable script test_cyberwave_connection.py is not imported as a test.
testpaths = tests
# testpaths is ignored when a path is given (for example `pytest worker` from the
# repository root), so the manual script is also excluded explicitly.
addopts = --ignore-glob=*test_cyberwave_connection.py
